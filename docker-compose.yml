services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app_pw
      POSTGRES_DB: ballcleaner
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    restart: unless-stopped

  api:
    build: ./backend
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://app:app_pw@db:5432/ballcleaner
    restart: unless-stopped

  web:
    image: nginx:alpine
    depends_on:
      - api
    ports:
      - "80:80"
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/app/dist:/usr/share/nginx/html:ro
    restart: unless-stopped

volumes:
  pgdata:
